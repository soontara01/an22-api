# stack ทดสอบหลาย instance (แผนขั้น 13): postgres + pgbouncer + api 2 ตัว + load balancer (+ web ด้วย --profile web)
# ใช้ผ่าน scripts/multi-instance-check.sh เท่านั้น (สร้างรหัส / กุญแจสุ่มเองทุกรอบ, project แยก an22-multi — ไม่แตะ DB dev)
# port ฝั่งเครื่อง: lb 18080, api1 18081, api2 18082, web 14000 (127.0.0.1 เท่านั้น)
name: an22-multi

x-api: &api
  image: an22-api:local
  environment: &api-env
    DB_URL: jdbc:postgresql://pgbouncer:6432/${DB_NAME:-an22}
    DB_MIGRATE_URL: jdbc:postgresql://db:5432/${DB_NAME:-an22}
    DB_APP_USER: an22_app
    DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    DB_PLATFORM_USER: an22_platform
    DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD:?}
    # ทางที่ 2: migrate ก่อน deploy ด้วย scripts/db-apply.sh — แอป validate อย่างเดียว
    FLYWAY_MIGRATE: "false"
    PII_KEYS: ${PII_KEYS:?}
    PII_HASH_KEY: ${PII_HASH_KEY:?}
    JWT_SECRET: ${JWT_SECRET:?}
    APP_BASE_URL: http://localhost:14000
    JOBS_ENABLED: "true"
    JOBS_CRON: ${JOBS_CRON:-*/10 * * * * *}
    LOG_BODY: error
    # DB ของ stack นี้มีข้อมูล DEMO (seed) → validate ต้องเห็นไฟล์ seed ด้วย (image production ไม่มี db/seed)
    AN22_DB_LOCATIONS: filesystem:db/migration,filesystem:db/seed
  volumes:
    - ./db/seed:/app/db/seed:ro
  depends_on:
    pgbouncer:
      condition: service_started
  stop_grace_period: 50s   # SHUTDOWN_DRAIN 10 + graceful ≤ 30 + เผื่อ

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?}
      DB_ADMIN_USER: azure_admin
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?}
      DB_NAME: ${DB_NAME:-an22}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD:?}
    volumes:
      - ./db:/db:ro
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/10-an22.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${DB_NAME:-an22}"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    entrypoint: ["/bin/sh", "/an22/start.sh"]
    environment:
      DB_APP_USER: an22_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_PLATFORM_USER: an22_platform
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD:?}
    volumes:
      - ./docker/pgbouncer:/an22:ro
    depends_on:
      db:
        condition: service_healthy

  api1:
    <<: *api
    ports: ["127.0.0.1:18081:8080"]

  api2:
    <<: *api
    ports: ["127.0.0.1:18082:8080"]

  lb:
    image: nginx:1.28.0-alpine
    volumes:
      - ./docker/multi/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:18080:8080"]
    depends_on: [api1, api2]

  # an22-web จาก image ของมัน (สร้างจากสำเนาของ repo web — ไม่แก้ ../an22-web) ชี้ api ที่ lb
  web:
    profiles: [web]
    image: ${WEB_IMAGE:-an22-web:c2-check}
    environment:
      API_URL: http://lb:8080
      SESSION_SECRET: ${SESSION_SECRET:?}
      SESSION_STORE: memory
      COOKIE_SECURE: "false"
    ports: ["127.0.0.1:14000:4000"]
    depends_on: [lb]
