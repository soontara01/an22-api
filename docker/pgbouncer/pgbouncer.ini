; PgBouncer สำหรับ dev (compose) และ test (Testcontainers) — จำลอง PgBouncer ในตัวของ Azure Flexible Server
; ตั้งเฉพาะค่าที่ Azure ให้ตั้งได้ (pgbouncer.*) เพื่อให้พฤติกรรมเหมือน prod — ไม่มี query_timeout / idle_transaction_timeout
; ตาข่าย timeout อยู่ที่ role (db/roles.sql: statement_timeout, idle_in_transaction_session_timeout)

[databases]
; host `db` = ชื่อ service ใน compose / alias ใน network ของ Testcontainers
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
; สร้างจาก env ตอน start (start.sh) — ไม่มีรหัสใน repo
auth_file = /tmp/userlist.txt

pool_mode = transaction
; pgJDBC ใช้ server-side prepared statement หลังรันซ้ำ 5 ครั้ง — Azure: ตั้ง pgbouncer.max_prepared_statements > 0 ด้วย
max_prepared_statements = 200
default_pool_size = 20
max_client_conn = 500
query_wait_timeout = 120
server_idle_timeout = 600
; pgJDBC ส่ง extra_float_digits ตอนต่อ
ignore_startup_parameters = extra_float_digits

admin_users =
stats_users =
log_connections = 0
log_disconnections = 0
