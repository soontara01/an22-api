# load balancer ง่าย ๆ หน้า api 2 ตัว (round robin) — stack ทดสอบหลาย instance เท่านั้น
events {}
http {
  upstream api {
    server api1:8080;
    server api2:8080;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://api;
      # X-Real-IP / X-Forwarded-* ของ web ส่งต่อตามเดิม (header ของ client ผ่านไปเอง)
      add_header X-Upstream $upstream_addr always;
    }
  }
}
